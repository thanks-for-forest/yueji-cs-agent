version: "3.8"

services:
  api:
    build: .
    container_name: yueji-cs-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  web:
    build: .
    container_name: yueji-cs-web
    ports:
      - "8501:8501"
    depends_on:
      - api
    env_file: .env
    environment:
      - API_PORT=8000
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped
