name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (correctness)
        run: ruff check src config scripts --select E4,E7,E9,F63,F7,F82 --output-format=concise

  test:
    name: Offline tests (no LLM / Ollama)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline test suite
        run: python -m pytest tests -m "not integration" -q
      - name: Verify imports / module boot
        run: |
          python -c "from src.api.main import app; print('api app ok')"
          python -c "from src.graph.workflow import build_graph; print('graph ok')"
